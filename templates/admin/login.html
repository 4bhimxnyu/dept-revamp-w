{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="wrap section narrow">
  <h1>Admin login</h1>
  <p class="meta">For the department content editor. Visitors do not need an account.</p>
  <form method="post" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}<p class="field-error" role="alert">{{ error }}</p>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" maxlength="40" autocomplete="username"
           value="{{ request.form.get('username', '') }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="80" autocomplete="current-password">
    <button class="button" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
